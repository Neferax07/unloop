name: ci

on:
  push:
    branches: [main, master]
  pull_request:

# read-only token: the workflow never pushes anywhere
permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # both actions pinned to commit hashes; bump the hash to move versions
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: tests (scalar fallback correctness on all platforms)
        run: cargo test --release
      - name: cli selftest
        run: cargo run --release --bin unloop -- selftest
      - name: ffi feature build
        run: cargo build --release --features ffi
      - name: package dry-run
        run: cargo package --allow-dirty

  bench-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # the SIMD path compiles only with avx2 in target features; the CI
          # runner proves the scalar fallback is correct everywhere, and this
          # job proves the SIMD path compiles and passes when enabled
          rustflags: -C target-cpu=native
      - name: tests with SIMD path live
        run: cargo test --release
      - name: bench smoke (compiles + runs)
        run: cargo run --release --example bench

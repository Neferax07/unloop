[package]
name = "unloop"
version = "0.1.1"
edition = "2021"
authors = ["Neferax"]
description = "Weight-free, deterministic repetition governor for LLM decoding — minimal-intervention loop breaking over a finite-ring phase governor"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Neferax07/unloop"
readme = "README.md"
keywords = ["llm", "decoding", "repetition", "sampler", "no-std"]
categories = ["no-std", "algorithms"]
exclude = [".cargo", ".github", "PLAN.md", "assets"]

[[bin]]
name = "unloop"
path = "src/main.rs"

[features]
default = []
ffi = []

[dependencies]

[profile.release]
lto = true
codegen-units = 1
